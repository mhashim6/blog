<footer class="site-footer">
  <p class="copyright">© {{ now.Format "2006" }} {{.Site.Title}}</p>
  {{- if hugo.Data.social }}
  <ul class="social-links">
    {{ range hugo.Data.social }}
    <li>
      <a
        target="_blank"
        class='icon icon-{{ .html_class | default "icon" }}'
        href="{{ .link }}"
        aria-label="Follow on {{ .name }}"
      ></a>
    </li>
    {{ end }}
  </ul>
  {{- end }}
</footer>
